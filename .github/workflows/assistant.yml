name: issue 助手

# 两件事：
#   · 新 issue    → 分类 + 打标签 + 首回（事实只来自 docs/known-issues.md，不编造）
#   · 斜杠命令    → /review /triage /merge /help（仅维护者可用）
#
# 普通评论**不回复**。机器人到处插嘴会把真正的讨论淹掉，也会让人直接屏蔽它。
#
# 事故锚点（L-028）：`command` job 原先吃顶层默认值 `contents: read`，
#   而 `/merge` 分支 spawn 的 auto-merge.js 要 `PUT /pulls/{n}/merge` ⇒ 恒 403。
#   命令、脚本、workflow 三样都齐，唯独权限没对齐，而这条命令从没人发过 ——
#   于是它安静地坏了很久。现在权限逐 job 显式声明，selftest 里有耦合断言盯着。

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# 🔴 顶层全无，两个 job 各要各的 —— 它们需要的权限**不一样**，这正是不能用顶层一刀切的原因：
#    · triage 只碰 issue（分类 + 打标签 + 首回），不需要碰 PR，也不该需要；
#    · command 要代替人跑 /review /triage /merge，所以必须覆盖这三条链路的总和。
permissions: {}

concurrency:
  group: assistant-${{ github.event.issue.number }}
  cancel-in-progress: false   # 回复类操作不要被半路取消，否则会出现"回了半句"

jobs:
  triage:
    name: 新 issue 分类与首回
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 只发评论 + 打标签，全在 issues 接口上。
    # ⚠️ 故意**不给** pull-requests: write —— triage 不碰 PR，多给一份就是白多一份。
    permissions:
      contents: read
      issues: write
      models: read        # 分类走 GitHub Models
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 分类并回复
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node tools/ci/issue-triage.js

  command:
    name: 斜杠命令
    # 三层过滤，一层比一层省：
    #   ① 必须是评论事件 ② 必须以 / 开头 ③ 必须是维护者
    # 第 ③ 条放在 workflow 层（而不是只靠脚本里判断）是为了**不让外部用户随便拉起来一个 job**
    # —— 脚本里还会再校验一次并点踩，那是防御纵深，不是替代。
    if: |
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 权限 = /review + /triage + /merge 三条链路需要的并集，一个不多。
    #
    # 🔴 `contents: write` 是 `/merge` 要的，不是多给的：handle-command.js 在 `/merge` 分支里
    #    直接 spawn `auto-merge.js`，而它要 `PUT /pulls/{n}/merge` —— 没有 contents: write 就是 403。
    #    （2026-11-12 体检发现：此前这里继承顶层 `contents: read`，`/merge` 从来就合不动，
    #     只是没人真发过这条命令，所以一直显示"配置完成"。selftest 里有一条耦合断言盯着这个。）
    # 危险面没有变大：本 job 有 workflow 层的 author_association 三重过滤，只有维护者能拉起。
    permissions:
      contents: write
      issues: write
      pull-requests: write
      models: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 执行命令
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PJ_REVIEW_MODEL: ${{ vars.PJ_REVIEW_MODEL || 'openai/gpt-4o' }}
        run: node tools/ci/handle-command.js
