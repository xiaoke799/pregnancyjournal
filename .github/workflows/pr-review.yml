name: PR 审查

# 为什么用 pull_request_target 而不是 pull_request：
#   fork 来的 PR，用 pull_request 事件拿到的 GITHUB_TOKEN 是**只读**的，贴不了评论、
#   打不了标签 —— 而外部贡献者的 PR 恰恰最需要自动反馈。
#   pull_request_target 能拿到可写 token，但代价是：**绝不能执行 PR 里的代码**
#   （否则等于把仓库写权限交给任何一个提 PR 的人）。
#
# 所以这里的铁律只有一条，任何改动都不许破：
#   checkout 只能取 base 分支（default branch），**永远不许 ref 成 pull_request.head.sha**。
#   审查器只把 diff 当文本读，不 npm install、不跑测试、不执行 PR 里的任何脚本。
#
# 事故锚点（改这个文件前先读一眼这几条，都是它长成现在这样的原因）：
#   · L-021 只看 diff 的审查器，结构上发现不了「别处还有一样的写法」→ 所以有 sibling-leftover 检查
#   · L-022 空输入被判「通过」→ 所以 empty-diff 是阻断项，不是提示
#   · L-023 分页/上限截断把「没查到」变成「没问题」→ 所以 files 被截断就不判 pass
#   · L-027 第三参数当请求体，8 处写调用从没真跑过 → 所以有 gh.js 防呆 + selftest I 段

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # 手动入口：不新开 PR 也能验证整条审查链路，或重跑某次审查。
  # 🔴 只有有 write 权限的人能触发；checkout 仍固定 base 分支，diff 仍只当文本读。
  workflow_dispatch:
    inputs:
      pr_number:
        description: '要审查的 PR 号'
        required: true
        type: number

# 🔴 顶层一律全无，权限必须显式下沉到 job。
#    理由：顶层 permissions 是**所有 job 的默认值**。只要这里写了一条 write，
#    以后任何人新加一个 job 都会白拿写权限 —— 而他只是在想"加个测试"。
#    把它写成 `{}` 之后，"这个 job 能写什么"必须被显式回答一次，写漏了会立刻 403 暴露，
#    而不是悄悄多给一份权限。（借鉴 magpie：能写的不跑 PR 代码，跑 PR 代码的不给写）
permissions: {}

# 同一个 PR 连续推送时，只审最新一次（旧的那次结论已经过期，没必要留着占额度）
concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # draft 不审：作者还在写，审了只会制造噪音。
    # dispatch 时没有 pull_request payload，PR 的 draft 状态由脚本从 API 读真实元数据判断。
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read          # 只读 base 分支
      pull-requests: write    # 贴评论
      issues: write           # 打标签（标签挂在 issue 接口上）
      models: read            # GitHub Models：用 GITHUB_TOKEN 直连，不需要另配 key
    steps:
      - name: 检出 base 分支（🔴 不是 PR 的 head）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 审查
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          # 模型可换：openai/gpt-4o（默认，质量好）/ openai/gpt-4o-mini（省额度）
          PJ_REVIEW_MODEL: ${{ vars.PJ_REVIEW_MODEL || 'openai/gpt-4o' }}
        run: node tools/ci/pr-review.js

      - name: 结论
        if: always()
        run: |
          case "${{ job.status }}" in
            success) echo "✅ 审查通过（无阻断项）" ;;
            *) echo "本 job 失败 = 审查有阻断项或需要人工过一遍（不是 CI 挂了）" ;;
          esac
